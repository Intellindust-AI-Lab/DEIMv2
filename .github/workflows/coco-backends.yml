name: COCO evaluation backends

on:
  pull_request:
    paths:
      - "engine/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/coco-backends.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        faster-coco-eval: ["1.6.7", "1.7.2"]
    env:
      PYTHONPATH: .
      RAYON_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the project's pinned PyTorch CPU build
        run: python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install evaluation test dependencies
        run: python -m pip install -r requirements.txt pytest pycocotools "faster-coco-eval==${{ matrix.faster-coco-eval }}" "ultrafast-pycocotools>=0.1.11,<0.2"
      - name: Test arrays, image-ID merge, YAML, cleanup and distributed aggregation
        run: python -m pytest -v tests/test_coco_backend.py
