task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

num_classes: 2
remap_mscoco_category: False

train_dataloader:
  type: DataLoader
  dataset:
    type: MultiFrameCocoDetection
    img_folder: /datadrive/data_phase11_5/train
    ann_file: ./annotations/phase_11_5_train_coco.json
    return_masks: False
    frame_offsets: [0.5]
    frame_tolerance: 0.06
    diff_mode: signed
    missing_frame: zeros
    transforms:
      type: Compose
      ops:
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: True
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction

val_dataloader:
  type: DataLoader
  dataset:
    type: MultiFrameCocoDetection
    img_folder: /datadrive/data_phase11_5/val
    ann_file: ./annotations/phase_11_5_val_coco.json
    return_masks: False
    frame_offsets: [0.5]
    frame_tolerance: 0.06
    diff_mode: signed
    missing_frame: zeros
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
